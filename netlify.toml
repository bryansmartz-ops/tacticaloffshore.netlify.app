# netlify.toml
# Complete Forced Rewrite Matrix
# ─────────────────────────────────────────────────────────────────────

[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from   = "/get-latest-brief"
  to     = "/.netlify/functions/get-latest-brief"
  status = 200
  force  = true

[[redirects]]
  from   = "/get-sst-tile"
  to     = "/.netlify/functions/get-sst-tile"
  status = 200
  force  = true

[[redirects]]
  from   = "/.netlify/*"
  to     = "/.netlify/:splat"
  status = 200
  force  = true

# Explicitly set force = false so it NEVER intercepts real background server functions
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false
