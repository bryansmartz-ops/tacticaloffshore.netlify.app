name: NOAA SST Ingestion Cron Pipeline

on:
  schedule:
    # Executes exactly 3 times a day at 04:00, 12:00, and 20:00 UTC
    - cron: '0 4,12,20 * * *'
  workflow_dispatch: # Allows you to manually click a button to run it instantly

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Fixes the unexpected input warning

    - name: Install High-Performance Marine Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests numpy xarray netcdf4 Pillow matplotlib supabase

    - name: Execute Core NOAA Data Ingestion Engine
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python sst_ingest_pipeline.py
